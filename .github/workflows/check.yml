name: Check trial workflow
on:
  push:
    branches-ignore: [main] # main is checked by deploy.yml before deployment.
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: student
          POSTGRES_PASSWORD: student_dev
          POSTGRES_DB: student_sys
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U student -d student_sys"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://student:student_dev@localhost:5433/student_sys
      SEED_PASSWORD: DemoPass2026!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-compose.mjs
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm check && pnpm test && pnpm test:integration
      - run: pnpm build
      - run: pnpm openapi:generate
      - run: git diff --exit-code -- openapi.json packages/common/src/generated/api.d.ts
